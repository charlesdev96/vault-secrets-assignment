# A small demo app that gets its database secret from Vault.
# There is NO password in this file, in a ConfigMap, or in an environment variable.

# The ServiceAccount is the app's identity. Vault checks it at login.
# The name (app-sa) and namespace (app) must match the Vault role
# created by vault-setup/vault-config.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      # The annotations go on the POD (template.metadata), not on the Deployment.
      annotations:
        # 1. Turn on the Vault Agent Injector for this pod
        vault.hashicorp.com/agent-inject: "true"

        # 2. Which Vault role to log in as (created in vault-config.sh)
        vault.hashicorp.com/role: "app-role"

        # 3. Which secret to read. The text after "agent-inject-secret-" is the
        #    file name, so this creates the file /vault/secrets/database.txt
        vault.hashicorp.com/agent-inject-secret-database.txt: "secret/data/app/database"

        # 4. A custom template that writes the secret as KEY=VALUE lines
        vault.hashicorp.com/agent-inject-template-database.txt: |
          {{- with secret "secret/data/app/database" -}}
          DB_USERNAME={{ .Data.data.username }}
          DB_PASSWORD={{ .Data.data.password }}
          {{- end }}

        # 5. How often the agent checks for a changed secret (the default is 5 minutes).
        #    30s lets us see a rotation quickly in the demo.
        vault.hashicorp.com/template-static-secret-render-interval: "30s"
    spec:
      serviceAccountName: app-sa      # must be the ServiceAccount named in the Vault role
      containers:
        - name: demo-app
          image: busybox:1.36
          # The demo app only proves the file exists. It hides the values,
          # so the password never appears in the logs.
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "--- $(date)"
                sed 's/=.*/=<hidden>/' /vault/secrets/database.txt
                echo "file fingerprint: $(md5sum /vault/secrets/database.txt | cut -c1-8)"
                sleep 20
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
